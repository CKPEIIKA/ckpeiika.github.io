<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Интерактивный каталог к лекции об уравнениях в частных производных для CFD.">
  <title>Лекция 2 CFD — интерактивные УЧП</title>
  <link rel="icon" href="data:,">
  <script src="../theme-init.js"></script>
  <link rel="stylesheet" href="../../assets/fonts/open-sans/open-sans.css">
  <link rel="stylesheet" href="../../lib/chalkish/examples/chalkboard-theme.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="lecture-header">
    <a class="course-link" href="../../pages/cfd2025.html">← <span data-course-label>к странице курса</span></a>
    <h1>Лекция 2 CFD: уравнения в частных производных</h1>
    <div class="header-tools">
      <button class="demo-theme-toggle" type="button" data-theme-toggle aria-label="Включить тёмную тему">☾</button>
      <nav class="locale-switch" data-locale-switch aria-label="Язык">
        <a href="?lang=en" data-lang="en" lang="en">EN</a>
        <span aria-hidden="true">/</span>
        <a href="?lang=ru" data-lang="ru" lang="ru">RU</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="gallery" class="gallery-view">
      <header class="gallery-heading">
        <h2 id="gallery-title" tabindex="-1">Каталог</h2>
        <p id="gallery-introduction">Выберите рисунок. Готовая демонстрация откроется на месте каталога; кнопка × вернёт к списку.</p>
      </header>
      <div id="catalogue-grid" class="catalogue-grid"></div>
    </section>

    <section id="demo-view" class="demo-view" hidden>
      <header class="demo-toolbar">
        <h2 id="demo-title"></h2>
        <nav class="demo-navigation" aria-label="Навигация по демонстрациям">
          <button id="previous-demo" type="button" aria-label="Предыдущая демонстрация" title="Предыдущая демонстрация">‹</button>
          <button id="next-demo" type="button" aria-label="Следующая демонстрация" title="Следующая демонстрация">›</button>
          <button id="close-demo" type="button" aria-label="Закрыть демонстрацию и вернуться в каталог" title="Закрыть демонстрацию и вернуться в каталог">×</button>
        </nav>
      </header>
      <div id="demo-host"></div>
    </section>
  </main>

  <noscript>Для интерактивных рисунков требуется JavaScript; внешние службы не используются.</noscript>
  <script type="module" src="../theme.js"></script>
  <script type="module" src="./app.js"></script>
