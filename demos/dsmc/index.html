<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Compact chalkboard frontend for four deterministic spatial DSMC experiments." data-i18n-content="page.description">
  <title>DSMC Laboratory</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../lib/chalkish/examples/chalkboard-theme.css">
  <link rel="stylesheet" href="../../lib/chalkish/examples/reference-labs.css">
  <link rel="stylesheet" href="../lab-overrides.css">
</head>
<body>
  <header class="lab-header">
    <a class="board-home" href="../../pages/dsmc-demo.html" aria-label="Course page" data-i18n-aria-label="nav.course">
      <span aria-hidden="true">←</span> <span class="course-label" data-i18n="nav.course">course page</span>
    </a>
    <h1 data-i18n="page.title">DSMC</h1>
    <nav class="locale-switch" data-locale-switch aria-label="Language" data-i18n-aria-label="locale.label">
      <a href="?lang=en" data-lang="en" lang="en">EN</a>
      <span aria-hidden="true">/</span>
      <a href="?lang=ru" data-lang="ru" lang="ru">RU</a>
    </nav>
  </header>

  <main class="lab-layout">
    <section class="lab-stage" aria-label="Spatial DSMC numerical stage" data-i18n-aria-label="stage.dsmc">
      <div class="stage-viewport" data-stage-viewport>
        <div class="stage-canvas">
          <canvas id="stage" width="1120" height="630"
                  aria-label="Particles, collision-cell occupancy, walls, and speed distribution" data-i18n-aria-label="stage.dsmcCanvas"></canvas>
          <div id="distribution-tabs" class="distribution-tabs" data-expanded="true">
            <div class="distribution-tabbar">
              <button type="button" data-action="previous-plot"
                      aria-label="Previous graph" title="Previous graph"
                      data-i18n-aria-label="plot.previous" data-i18n-title="plot.previous">‹</button>
              <button type="button" class="distribution-tab" data-action="toggle-plot"
                      aria-expanded="true" aria-controls="distribution-stage"
                      aria-label="Hide graph" title="Hide graph"
                      data-i18n-aria-label="plot.hide" data-i18n-title="plot.hide">
                <span id="distribution-tab-label">Speeds</span>
                <small id="distribution-tab-legend">sample — Maxwellian ╌</small>
              </button>
              <button type="button" data-action="next-plot"
                      aria-label="Next graph" title="Next graph"
                      data-i18n-aria-label="plot.next" data-i18n-title="plot.next">›</button>
            </div>
            <div id="distribution-plot" class="distribution-plot" aria-hidden="true">
              <canvas id="distribution-stage" width="440" height="210"></canvas>
            </div>
          </div>
        </div>
        <div id="stage-controls" class="stage-footer" data-stage-controls
             aria-label="Playback and viewport controls" data-i18n-aria-label="stage.controls">
          <button class="stage-controls-toggle" type="button" data-action="toggle-controls"
                  aria-label="Hide toolbar" title="Hide toolbar"
                  data-i18n-aria-label="stage.hideControls" data-i18n-title="stage.hideControls"
                  aria-pressed="false">
            <svg data-stage-icon class="stage-icon" viewBox="0 0 24 24"
                 aria-hidden="true" focusable="false">
              <g class="hide-controls-glyph">
                <path d="M2.5 12S6 6.5 12 6.5S21.5 12 21.5 12S18 17.5 12 17.5S2.5 12 2.5 12Z"/>
                <circle cx="12" cy="12" r="2.5"/>
                <path d="M4 4L20 20"/>
              </g>
              <g class="show-controls-glyph">
                <path d="M2.5 12S6 6.5 12 6.5S21.5 12 21.5 12S18 17.5 12 17.5S2.5 12 2.5 12Z"/>
                <circle cx="12" cy="12" r="2.5"/>
              </g>
            </svg>
          </button>
          <div class="stage-controls" data-stage-control-set>
            <button id="pause" type="button" data-action="pause"
                  aria-label="Pause animation" title="Pause animation" aria-pressed="false">
            <svg data-stage-icon class="stage-icon" viewBox="0 0 24 24"
                 aria-hidden="true" focusable="false">
              <path class="pause-glyph" d="M7 5V19M17 5V19"/>
              <path class="play-glyph" d="M8 5L19 12L8 19Z"/>
            </svg>
          </button>
          <button id="step" type="button" data-action="step"
                  aria-label="Advance one DSMC step" title="Advance one DSMC step"
                  data-i18n-aria-label="stage.step" data-i18n-title="stage.step">
            <svg data-stage-icon class="stage-icon" viewBox="0 0 24 24"
                 aria-hidden="true" focusable="false">
              <path d="M6 5L16 12L6 19ZM19 5V19"/>
            </svg>
          </button>
          <label class="stage-speed">
            <span class="visually-hidden" data-i18n="stage.speed">Playback speed</span>
            <svg data-stage-icon class="stage-icon" viewBox="0 0 24 24"
                 aria-hidden="true" focusable="false">
              <path d="M4 17A8 8 0 0 1 20 17M12 16L16 10M6 19H18"/>
            </svg>
            <select data-playback-rate aria-label="Playback speed">
              <option value="0.25">¼×</option>
              <option value="0.5">½×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
            </select>
          </label>
          <button type="button" data-action="grab"
                  aria-label="Toggle grab tool" title="Grab and pan" aria-pressed="false"
                  data-i18n-aria-label="stage.grab" data-i18n-title="stage.grab">
            <svg data-stage-icon class="stage-icon" viewBox="0 0 24 24"
                 aria-hidden="true" focusable="false">
              <path d="M7.2 11V6.2A1.8 1.8 0 0 1 10.8 6V10V4.8A1.8 1.8 0 0 1 14.4 4.8V10V6.2A1.8 1.8 0 0 1 18 6.2V12V9A1.8 1.8 0 0 1 21.6 9V14.2C21.6 18.4 18.4 21 14.2 21H12C8.8 21 7.1 19.4 5.5 17L2.8 13A1.9 1.9 0 0 1 5.8 10.7L7.2 12.1"/>
            </svg>
          </button>
          <span class="stage-zoom" role="group" aria-label="Zoom controls">
            <button type="button" data-action="zoom-out" aria-label="Zoom out" title="Zoom out"
                    data-i18n-aria-label="stage.zoomOut" data-i18n-title="stage.zoomOut">
              <svg data-stage-icon class="stage-icon" viewBox="0 0 24 24"
                   aria-hidden="true" focusable="false">
                <circle cx="10.5" cy="10.5" r="6.5"/>
                <path d="M6.8 10.5H14.2M15.2 15.2L21 21"/>
              </svg>
            </button>
            <button type="button" data-action="zoom-in" aria-label="Zoom in" title="Zoom in"
                    data-i18n-aria-label="stage.zoomIn" data-i18n-title="stage.zoomIn">
              <svg data-stage-icon class="stage-icon" viewBox="0 0 24 24"
                   aria-hidden="true" focusable="false">
                <circle cx="10.5" cy="10.5" r="6.5"/>
                <path d="M6.8 10.5H14.2M10.5 6.8V14.2M15.2 15.2L21 21"/>
              </svg>
            </button>
            <button type="button" data-action="reset-view"
                    aria-label="Reset view" title="Reset view"
                    data-i18n-aria-label="stage.resetView" data-i18n-title="stage.resetView">
              <svg data-stage-icon class="stage-icon" viewBox="0 0 24 24"
                   aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 2V5M12 19V22M2 12H5M19 12H22"/>
              </svg>
            </button>
          </span>
          <button type="button" data-action="fullscreen"
                  data-i18n-aria-label="stage.enterFullscreen"
                  data-i18n-title="stage.enterFullscreen"
                  aria-label="Enter fullscreen" title="Enter fullscreen"
                  aria-pressed="false">
            <svg data-stage-icon class="stage-icon" viewBox="0 0 24 24"
                 aria-hidden="true" focusable="false">
              <path class="expand-glyph" d="M4 9V4H9M15 4H20V9M20 15V20H15M9 20H4V15"/>
              <path class="collapse-glyph" d="M9 4V9H4M15 4V9H20M20 15H15V20M4 15H9V20"/>
            </svg>
          </button>
          </div>
          <pre id="diagnostics" aria-live="polite"></pre>
        </div>
      </div>
    </section>

    <aside class="lab-controls" aria-label="Spatial DSMC controls" data-i18n-aria-label="controls.dsmc">
      <h2 data-i18n="page.settings">Board settings</h2>
      <fieldset>
        <legend data-i18n="page.experiment">Experiment</legend>
        <label class="control-row">
          <span data-i18n="page.case">Case</span>
          <select id="case-id">
            <option value="equilibrium-box" selected data-i18n="case.equilibrium">Equilibrium box</option>
            <option value="heat-transfer-x" data-i18n="case.heat">Heat transfer x</option>
            <option value="rotational-nitrogen" data-i18n="case.rotation">Rotational N₂</option>
            <option value="couette-flow" data-i18n="case.couette">Couette flow</option>
          </select>
        </label>
        <label class="control-row">
          <span data-i18n="page.particles">Particles</span>
          <select id="particle-count">
            <option value="800">800</option>
            <option value="1600">1600</option>
            <option value="2400" selected>2400</option>
            <option value="3200">3200</option>
            <option value="4000">4000</option>
          </select>
        </label>
        <label class="control-row">
          <span data-i18n="page.model">Model</span>
          <select id="collision-model">
            <option value="hard-sphere" data-i18n="model.hs">Hard sphere</option>
            <option value="vhs" selected>VHS</option>
            <option value="vss">VSS</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend data-i18n="page.cellClock">Cell and clock</legend>
        <label class="control-row">
          <span>Kn <output id="knudsen-value">0.20</output></span>
          <input id="knudsen" type="range" min="0.05" max="1" step="0.05" value="0.20">
        </label>
        <label class="control-row">
          <span data-i18n="page.cellSize">Cell size</span>
          <select id="cell-size">
            <option value="0.12">0.12</option>
            <option value="0.16" selected>0.16</option>
            <option value="0.20">0.20</option>
            <option value="0.30">0.30</option>
            <option value="0.50">0.50</option>
          </select>
        </label>
        <label class="control-row">
          <span>Δt</span>
          <select id="time-step">
            <option value="0.00015">0.15 ms</option>
            <option value="0.00020">0.20 ms</option>
            <option value="0.00030" selected>0.30 ms</option>
            <option value="0.00040">0.40 ms</option>
          </select>
        </label>
      </fieldset>

      <details>
        <summary data-i18n="page.wallControls">Wall controls</summary>
        <fieldset>
          <legend data-i18n="page.maxwell">Maxwell boundary</legend>
          <label class="control-row">
            <span><span data-i18n="page.accommodation">Accommodation</span> <output id="wall-accommodation-value">1.00</output></span>
            <input id="wall-accommodation" type="range" min="0" max="1" step="0.05" value="1">
          </label>
          <label class="control-row">
            <span data-i18n="page.leftTemperature">Left T / K</span>
            <input id="wall-temperature-left" type="number" min="50" max="5000" step="10" value="300">
          </label>
          <label class="control-row">
            <span data-i18n="page.rightTemperature">Right T / K</span>
            <input id="wall-temperature-right" type="number" min="50" max="5000" step="10" value="300">
          </label>
          <label class="control-row">
            <span data-i18n="page.wallSpeed">Wall speed / m s⁻¹</span>
            <input id="wall-speed" type="number" min="-2000" max="2000" step="10" value="0">
          </label>
        </fieldset>
      </details>

      <button id="reset" class="reset-model" type="button" data-i18n="page.reset">Reseed numerical model</button>
    </aside>
  </main>

  <noscript>This numerical board requires JavaScript; it uses no remote services.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
