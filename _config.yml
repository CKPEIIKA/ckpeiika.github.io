title: Sitecity CKPEIIKA
description: Notes and resources on gas dynamics and ML
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  math_engine: mathjax
plugins:
  - kramdown-parser-gfm
exclude:
  - AGENTS.md
  - README.md
  - demos/README.md
  - preview.sh
  - Gemfile
  - Gemfile.lock
  - package.json
  - scripts
  - test
  - todo
  - lib/chalkish/LICENSE
  - lib/chalkish/README.md
  - lib/chalkish/SOURCE_REVISION
  - lib/chalkish/TODO.md
  - lib/chalkish/docs
  - lib/chalkish/package.json
  - lib/chalkish/test
  - lib/chalkish/support
# Only for `jekyll serve` (./preview.sh): browsers revalidate every file, so an edited ES module
# is never mixed with a cached older one. GitHub Pages ignores this setting.
webrick:
  headers:
    Cache-Control: no-cache
