title: Sitecity CKPEIIKA
description: Notes and resources on gas dynamics and ML
markdown: kramdown
include:
  # GitHub Pages/Jekyll otherwise skips this shared ES-module directory because
  # its name starts with an underscore.
  - lib/chalkish/examples/boards/_shared
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  math_engine: mathjax
plugins:
  - kramdown-parser-gfm
exclude:
  - AGENTS.md
  - README.md
  - package.json
  - scripts
  - test
  - todo
  - lib/chalkish/LICENSE
  - lib/chalkish/README.md
  - lib/chalkish/SOURCE_REVISION
  - lib/chalkish/TODO.md
  - lib/chalkish/docs
  - lib/chalkish/package.json
  - lib/chalkish/test
  - lib/chalkish/support
