title: Sitecity CKPEIIKA
description: Notes and resources on gas dynamics and ML
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  math_engine: mathjax
plugins:
  - kramdown-parser-gfm
# Jekyll matches explicitly included nested directories by basename while traversing.
# Publish the reusable template for direct access; its page metadata keeps it unlisted.
include:
  - _template
exclude:
  - AGENTS.md
  - README.md
  - demos/README.md
  - demos/pde-lecture-6/README.md
  - preview.sh
  - Gemfile
  - Gemfile.lock
  - package.json
  - scripts
  - tests
  - todo
  - lib/chalkish/LICENSE
  - lib/chalkish/README.md
  - lib/chalkish/SOURCE_REVISION
  - lib/chalkish/TODO.md
  - lib/chalkish/docs
  - lib/chalkish/package.json
  - lib/chalkish/test
  - lib/chalkish/support
# Only for `jekyll serve` (./preview.sh): browsers revalidate every file, so an edited ES module
# is never mixed with a cached older one. GitHub Pages ignores this setting.
webrick:
  headers:
    Cache-Control: no-cache
