<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <link rel="icon" type="image/png" href="{{ '/hero.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/fonts/open-sans/open-sans.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  {% if page.math %}
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
        ignoreHtmlClass: 'tex2jax_ignore'
      }
    };
  </script>
  <script id="MathJax-script" async src="{{ '/vendor/mathjax/es5/tex-mml-chtml.js' | relative_url }}"></script>
  {% endif %}
</head>
<body>

  <a id="top"></a>
  <h1>{{ page.title }}</h1>

  {% include nav.html %}

  <main>
    {{ content }}
  </main>

  <p class="footer-links">
    <a href="{{ '/index.html' | relative_url }}">⬅ Обратно на домашнюю страничку</a>
    <span> </span>
    <a href="#top">↑ Наверх</a>
  </p>
  <footer class="site-meta">
    <p>Обновлено: {{ site.time | date: "%d.%m.%Y" }}. Лицензия: MIT</p>
  </footer>

</body>
</html>
